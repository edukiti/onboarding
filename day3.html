const DAY  = 'День 3';
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

let USER = null;

async function api(payload){
  const res = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},  // так браузер не шлёт preflight
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function decryptAndShow(key){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(key), 'PBKDF2', false, ['deriveKey']);
  const ck = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64(DATA.salt), iterations:DATA.iter, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(DATA.iv) }, ck, b64(DATA.data));
  const html = new TextDecoder().decode(plain);

  const frame = document.createElement('iframe');
  frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;display:block';
  frame.srcdoc = html;
  document.body.innerHTML='';
  document.body.style.cssText='margin:0;padding:0;background:#F7F4E6;overflow:hidden';
  document.body.appendChild(frame);
}

async function login(){
  const email = $('email').value.trim().toLowerCase();
  const pwd   = $('pwd').value;
  if(!email || !pwd) return;

  $('go').disabled = true;
  $('msg').textContent = 'Проверяю доступ…';

  try{
    const r = await api({ action:'login', email:email, password:pwd, day:DAY });
    if(!r.ok) throw new Error(r.error || 'Доступ не подтверждён');

    USER = { email:email, name:r.name, token:r.token||'' };
    await decryptAndShow(r.key);

  }catch(e){
    $('go').disabled = false;
    $('msg').textContent = (e && e.message) ? e.message : 'Не удалось войти';
    $('card').classList.add('err');
    setTimeout(()=>$('card').classList.remove('err'), 400);
  }
}

$('go').onclick = () => login();
['email','pwd'].forEach(id=>{
  $(id).addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
  $(id).addEventListener('input', ()=>{ $('msg').textContent=''; });
});

// приём отчётов из курса и отправка в таблицу
const queue = [];
let sending = false;

async function flush(){
  if(sending || !queue.length) return;
  sending = true;
  const item = queue.shift();
  try { await api(item); }
  catch(e){ queue.unshift(item); await new Promise(r=>setTimeout(r,4000)); }
  sending = false;
  if(queue.length) flush();
}

  for(let i = 0; i < 3 && !r; i++){
    try { r = await api({ action:'test', email:USER.email, token:USER.token, name:USER.name,
                          test:d.test, answers:d.answers, minutes:d.minutes||0 }); }
    catch(e){ await new Promise(res=>setTimeout(res, 3000)); }
  }
  testPending = false;
  win.postMessage(Object.assign({ __luchiTest:true }, r || { ok:false, error:'Нет связи с сервером. Нажми «Отправить» ещё раз — ответы сохранены.' }), '*');
}

addEventListener('message', ev => {
  const d = ev.data;
  if(!d || !d.__luchi || !USER) return;
  if(d.type === 'test'){ if(!testPending) sendTest(d, ev.source); return; }
  queue.push({ action:'event', email:USER.email, name:USER.name, day:DAY,
        type:d.type, kind:d.kind||'', label:d.label||'',
        id:d.id||'', text:d.text||'',
        done:d.done||0, total:d.total||0, minutes:d.minutes||0 });
  flush();
});

// не дать закрыть вкладку с неотправленным ответом
addEventListener('beforeunload', e => {
  if(queue.length || sending || testPending){ e.preventDefault(); e.returnValue = ''; }
});

// Пароль намеренно нигде не сохраняется. Каждый день, каждая вкладка
// и каждая перезагрузка требуют ввода заново — автоматического входа нет.
</script>
</body>
</html>
